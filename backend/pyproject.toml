[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oshi-dashboard-backend"
version = "0.1.0"
description = "Local FastAPI backend for a personal oshi dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "uvicorn>=0.34,<1",
  "feedparser>=6.0.14,<7",
]

[project.optional-dependencies]
dev = ["httpx2>=2.12,<3", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error",
  # Starlette 1.6 uses an AnyIO compatibility alias; keep all other warnings fatal.
  'ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
